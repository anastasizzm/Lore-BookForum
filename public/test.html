<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Design System</title>
    
    <!-- Подключаем твой файл -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- 1. Сначала ПЕРЕМЕННЫЕ -->
    <link rel="stylesheet" href="assets/css/variable.css">
    
    <!-- 2. Затем БАЗОВЫЕ СТИЛИ (сетка, body) -->
    <link rel="stylesheet" href="assets/css/base.css">

    <!-- 3. И в конце КОМПОНЕНТЫ (кнопки, карточки) - когда начнешь заполнять этот файл -->
    <link rel="stylesheet" href="assets/css/component.css">
    
    <!-- Стили чисто для теста переменных -->
    <style>
        body {
            background-color: var(--color-bg-main);
            color: var(--main-text-color);
            font-family: var(--font-family-base);
            padding: 20px;
        }
        .test-card {
            background-color: var(--color-white);
            border: 1px solid var(--border-card-color);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: var(--shadow-card);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="test-card">
        <h1 style="font-size: var(--font-size-h1);">Тестовый заголовок</h1>
        <p style="color: var(--interaction-text-color);">Если фон страницы светло-голубой, а карточка белая со скругленными углами — значит CSS подключился успешно!</p>
    </div>

</body>
</html>
