; Максимальный размер одного файла
upload_max_filesize = 100M

; Максимальный размер всего POST-тела.
; Должен быть больше upload_max_filesize — иначе форма с одним файлом 100M отклонится,
; а $_FILES будет пуст без внятной ошибки.
post_max_size = 105M

; Сколько файлов в одном запросе
max_file_uploads = 20

; Где PHP хранит временные файлы до move_uploaded_file.
; Путь должен существовать и быть writable для www-data.
upload_tmp_dir = /var/tmp/php-uploads

; Таймауты для медленных клиентов и больших файлов
max_execution_time = 300
max_input_time = 300