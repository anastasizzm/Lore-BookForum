services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    command: ["postgres", "-c", "port=${POSTGRES_PORT:-5433}"]
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${POSTGRES_PORT:-5433} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH:-}
      SEED_TEST_DATA: ${SEED_TEST_DATA:-false}
      DBMATE_MIGRATIONS_DIR: /storage/db/migrations
      DBMATE_SCHEMA_FILE: /storage/db/schema.sql
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./storage/db:/storage/db:ro    # schema.sql, init.sql, migrate.sh, migrations/
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /storage/db/migrate.sh > /tmp/migrate.sh && exec /bin/sh /tmp/migrate.sh

  php:
    build:
      context: ./docker/php
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/var/www/html
    environment:
      APP_DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB}?sslmode=disable

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/lore-bookforum.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  pgdata: