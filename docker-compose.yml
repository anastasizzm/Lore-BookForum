services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # Limited role for your application (created/updated by migrate.sh)
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_SCHEMA_FILE: /storage/db/schema.sql
      # Don't rewrite schema.sql after each `up` (mounts are read-only anyway)
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ${DBMATE_MIGRATIONS_DIR:?set DBMATE_MIGRATIONS_DIR in .env}:/migrations:ro  # migrations folder (host path)
      - ./storage/db:/storage/db:ro    # schema.sql, init.sql, migrate.sh
    entrypoint: ["/bin/sh", "/storage/db/migrate.sh"]

volumes:
  pgdata: