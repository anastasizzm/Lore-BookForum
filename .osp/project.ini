[lore]

base_url          = {host_scheme}://{host_decoded}{scheme_port}
bind_ip           = 192.168.0.102
http_engine       = Nginx
http_port         = 80
https_port        = 443
php_engine        = PHP-8.5
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host} 192.168.0.102
terminal_codepage = 65001
tls_cert_file     = {root_dir}/data/ssl/projects/lore/cert.crt
tls_enabled       = on
tls_key_file      = {root_dir}/data/ssl/projects/lore/cert.key
web_root          = {base_dir}\public
