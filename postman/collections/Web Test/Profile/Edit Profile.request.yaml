$kind: http-request
method: PUT
url: '{{base_url}}/users/{{userId}}/edit'
order: 3000
pathVariables:
  - key: userId
    value: '1'
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: username
      value: johndoe
    - key: email
      value: john@example.com
    - key: avatar
      value: 'https://example.com/avatar.jpg'
    - key: name
      value: John
    - key: surname
      value: Doe
    - key: bio
      value: 'Book enthusiast and avid reader'
