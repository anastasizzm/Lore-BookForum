$kind: http-request
method: POST
url: '{{base_url}}/register'
order: 4000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: username
      value: johndoe
    - key: email
      value: john@example.com
    - key: name
      value: John
    - key: surname
      value: Doe
    - key: password
      value: secret1234
